<script>
    x = 101;
    y = 1;

    /* 
        ()
    /  *   %  **
    +  -
    */

    console.log(2 ** 4);

    console.log(19 % 10);

    z = (5 + 3) / (4 - 2);

    console.log(z);

    console.log(x + y);

    w = 10;
    w += 3;     //w = w + 3;
    w += z * w;   //w = w + z * w;

    w --;
    console.log(++w);
    console.log(w);
</script>
