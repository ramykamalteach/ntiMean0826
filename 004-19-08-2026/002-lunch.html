<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #meals {
            width: 75%;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            row-gap: 64px;
        }

        #meals > div {
            width: 48%;
            display: flex;
            gap: 36px;
        }
        img {
            border-radius: 16px;
        }
        h1 {
            text-align: center;
            margin: 48px;
            font-size: 48px;
        }
    </style>
</head>
<body>
    <h1>Launch</h1>
    <div id="meals">

    </div>

    <script>
        meals = [
            ["Sed varius", "Aenean pharetra tortor dui in pellentesque", "$29.79", "lunch-01.jpg"],
            ["Sed varius", "Aenean pharetra tortor dui in pellentesque", "$29.79", "lunch-02.jpg"],
            ["Sed varius", "Aenean pharetra tortor dui in pellentesque", "$29.79", "lunch-03.jpg"],
            ["Sed varius", "Aenean pharetra tortor dui in pellentesque", "$29.79", "lunch-04.jpg"],
            ["Sed varius", "Aenean pharetra tortor dui in pellentesque", "$29.79", "lunch-05.jpg"],
            ["Sed varius", "Aenean pharetra tortor dui in pellentesque", "$29.79", "lunch-06.jpg"]
        ];

        for(i = 0; i < meals.length; i++) {
            let oneMeal = document.createElement("div");
            let mealImg = document.createElement("img");
                mealImg.setAttribute("src", "img/" + meals[i][3]);
                mealImg.setAttribute("width", "200");
            oneMeal.appendChild(mealImg);
            
            let mealDetails = document.createElement("div");
            let mealName = document.createElement("h3");
                mealName.innerText = meals[i][0];
            let mealDescription = document.createElement("p");
                mealDescription.innerText = meals[i][1];
            let mealPrice = document.createElement("h4");
                mealPrice.innerText = meals[i][2];
            
            mealDetails.appendChild(mealName);
            mealDetails.appendChild(mealDescription);
            mealDetails.appendChild(mealPrice);

            oneMeal.appendChild(mealDetails);

            document.querySelector("#meals").appendChild(oneMeal);
        }

            `;

            document.querySelector("#meals").innerHTML += oneMeal;
        } */
    </script>
</body>
</html>
